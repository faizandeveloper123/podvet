<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexagon Color Picker — MS Office "More Colors"</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #eef4fb 0%, #f8fafc 45%, #eef0f5 100%);
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .demo-card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .14), 0 4px 12px rgba(15, 23, 42, .06);
      padding: 22px;
    }
    .demo-card h1 {
      font-size: 16px;
      margin: 0 0 2px;
      color: #0f172a;
    }
    .demo-card .sub {
      font-size: 12px;
      color: #64748b;
      margin: 0 0 16px;
    }
    .demo-preview {
      margin-top: 18px;
      border-top: 1px dashed #e2e8f0;
      padding-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .demo-preview .bar {
      height: 10px;
      border-radius: 999px;
      background: #93CAED;
      margin-top: 8px;
      transition: background .2s ease;
    }
  </style>
</head>
<body>
  <div class="demo-card">
    <h1>Website Color</h1>
    <p class="sub">MS Office "More Colors" style — 60-color column palette + brightness slider</p>
    <div id="picker"></div>
    <div class="demo-preview">
      Page accent preview
      <div class="bar" id="bar"></div>
    </div>
  </div>

  <script src="/color-picker.js"></script>
  <script>
  PodVetColorPicker.init(document.getElementById('picker'), {
    value: '#93CAED',
    onChangeLive: function (hex) {
      document.getElementById('bar').style.background = hex;
    }
  });
  </script>
</body>
</html>
