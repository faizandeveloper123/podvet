<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · PodVet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#f6fbfe', 100: '#f6fbfe', 200: '#f2f9fd', 300: '#dceef9',
            400: '#c2e1f5', 500: '#92CAED', 600: '#6fb9e7', 700: '#55ace2',
            800: '#3b9fde', 900: '#2492d6', 950: '#1f7db7', dark: '#1b6ea1',
          },
        },
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .bg-soft { background: radial-gradient(1200px 600px at 50% -10%, #dceef9 0%, #f6fbfe 45%, #ffffff 100%); }
  .card-shadow { box-shadow: 0 20px 45px -20px rgba(31,125,183,.45); }
</style>
</head>
<body class="bg-soft min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-7">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500 text-3xl shadow-lg">🐾</div>
      <h1 class="mt-4 text-3xl font-extrabold tracking-tight text-slate-800">PodVet</h1>
      <p class="text-slate-500 text-sm mt-1">Veterinary Clinic Management</p>
    </div>

    <form id="form" class="bg-white rounded-3xl border border-brand-200/60 card-shadow p-8 space-y-5">
      <div>
        <h2 class="text-lg font-bold text-slate-800">Sign in</h2>
        <p id="hint" class="text-xs text-slate-400 mt-0.5">Use your clinic or platform account.</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Username or Email</label>
        <input id="identifier" autocomplete="username" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="you@clinic.com" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="••••••••" />
      </div>
      <div id="err" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></div>
      <button id="btn" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-900 font-bold rounded-xl py-2.5 transition">Sign in</button>
      <p class="text-center text-xs text-slate-400">Accounts are provisioned by your clinic or platform admin.</p>
    </form>

    <p class="text-center text-xs text-slate-400 mt-6">Powered by Parkar Technologies LLC</p>
  </div>

<script>
(function () {
  'use strict';
  const SESS_KEY = 'podvet_session';
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '';
  const asSuper = next.startsWith('/super-admin');

  // If already signed in, go straight through.
  try {
    if (asSuper && localStorage.getItem('podvet_super_token')) return location.replace('/super-admin');
    if (!asSuper && localStorage.getItem(SESS_KEY)) return location.replace(next || '/app');
  } catch (_) {}

  if (asSuper) {
    document.getElementById('hint').textContent = 'Platform staff sign-in.';
  }

  const form = document.getElementById('form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err'); err.classList.add('hidden');
    const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier: document.getElementById('identifier').value.trim(), password: document.getElementById('password').value }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((body.error && body.error.message) || body.error || 'Sign in failed');

      if (body.type === 'super_admin') {
        localStorage.setItem('podvet_super_token', body.token);
        location.replace('/super-admin');
      } else {
        localStorage.setItem(SESS_KEY, JSON.stringify({
          user: Object.assign({}, body.user, { isPlatformAdmin: false }),
          tokens: { accessToken: body.accessToken, refreshToken: body.refreshToken },
        }));
        location.replace(next || '/app');
      }
    } catch (err2) {
      document.getElementById('err').textContent = err2.message;
      document.getElementById('err').classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
