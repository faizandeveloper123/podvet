  function renderNav() {
    const nav = el('nav');
    nav.innerHTML = NAV.map((g) => {
      const items = g.items.map((it) => {
        const active = currentRoute() === it.id ? 'active' : '';
        return '<a href="#/' + it.id + '" class="nav-item ' + active + ' flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 cursor-pointer">' +
          '<span class="nav-ico w-5 h-5 text-slate-400">' + icon(it.icon, 'w-5 h-5') + '</span><span class="flex-1">' + esc(it.label) + '</span></a>';
      }).join('');
      return '<div><div class="px-3 mb-1 text-[10px] font-bold uppercase tracking-widest text-slate-400">' + esc(g.group || 'Overview') + '</div><div class="space-y-0.5">' + items + '</div></div>';
    }).join('');
    nav.querySelectorAll('a.nav-item').forEach((a) => a.addEventListener('click', (e) => {
      const id = a.getAttribute('href').slice(2);
      if (id === 'logout') { e.preventDefault(); doLogout(true); }
    }));
  }

  function currentRoute() {
    const h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    return h || 'dashboard';
  }

  // ── modal / confirm ─────────────────────────────────────────────────────
  function openModal(html, wide) {
    const m = el('modal');
    m.innerHTML = '<div class="bg-white rounded-2xl shadow-2xl w-full ' + (wide ? 'max-w-3xl' : 'max-w-lg') + ' max-h-[90vh] overflow-y-auto fade-in">' + html + '</div>';
    m.classList.remove('hidden'); m.classList.add('flex');
    m.onclick = (e) => { if (e.target === m) closeModal(); };
  }
  function closeModal() { const m = el('modal'); m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; }
  window.__closeModal = closeModal;

  function confirmDialog(title, message, danger) {
    return new Promise((resolve) => {
      openModal(
        '<div class="p-6">' +
          '<h3 class="text-lg font-bold text-slate-800">' + esc(title) + '</h3>' +
          '<p class="text-sm text-slate-500 mt-2">' + message + '</p>' +
          '<div class="flex justify-end gap-2 mt-6">' +
            '<button id="cf_no" class="btn btn-ghost">Cancel</button>' +
            '<button id="cf_yes" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '">Confirm</button>' +
          '</div></div>');
      el('cf_no').onclick = () => { closeModal(); resolve(false); };
      el('cf_yes').onclick = () => { closeModal(); resolve(true); };
    });
  }

  function statusBadge(s) {
    const map = {
      active: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      trial: 'bg-brand-50 text-brand-950 border-brand-300',
      expired: 'bg-red-50 text-red-700 border-red-200',
      expiring: 'bg-amber-50 text-amber-700 border-amber-200',
      suspended: 'bg-amber-50 text-amber-700 border-amber-200',
      cancelled: 'bg-slate-100 text-slate-600 border-slate-200',
      disabled: 'bg-red-50 text-red-700 border-red-200',
      true: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      false: 'bg-slate-100 text-slate-600 border-slate-200',
      paid: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      pending: 'bg-amber-50 text-amber-700 border-amber-200',
      overdue: 'bg-red-50 text-red-700 border-red-200',
      failed: 'bg-red-50 text-red-700 border-red-200',
      success: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      open: 'bg-brand-50 text-brand-950 border-brand-300',
      closed: 'bg-slate-100 text-slate-600 border-slate-200',
      healthy: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      degraded: 'bg-amber-50 text-amber-700 border-amber-200',
      high: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      medium: 'bg-amber-50 text-amber-700 border-amber-200',
      low: 'bg-red-50 text-red-700 border-red-200',
      never: 'bg-slate-100 text-slate-600 border-slate-200',
      paid_: 'bg-emerald-50 text-emerald-700 border-emerald-200',
    };
    const label = s === true ? 'true' : s === false ? 'false' : (s || 'unknown');
    return '<span class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-semibold ' + (map[String(s)] || 'bg-slate-50 text-slate-600 border-slate-200') + '">' + esc(label) + '</span>';
  }

  function spinner() {
    return '<div class="flex items-center justify-center py-16 text-slate-400"><svg class="animate-spin h-6 w-6 mr-2 text-brand-700" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>Loading…</div>';
  }
  function cardBox(label, value, sub, tone) {
    return '<div class="card p-5"><div class="text-xs font-semibold uppercase tracking-wide text-slate-400">' + esc(label) + '</div>' +
      '<div class="text-2xl font-bold text-slate-800 mt-1">' + value + '</div>' +
      (sub ? '<div class="text-xs mt-1 ' + (tone || 'text-slate-400') + '">' + sub + '</div>' : '') + '</div>';
  }
  function emptyRow(cols, msg) { return '<tr><td colspan="' + cols + '" class="td text-center text-slate-400 py-10">' + esc(msg || 'Nothing here yet.') + '</td></tr>'; }
  function toolbar(inner) { return '<div class="flex flex-wrap items-center gap-2 mb-4">' + inner + '</div>'; }
  function searchInput(id, value, ph) {
    return '<div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">' + icon('search', 'w-4 h-4') + '</span>' +
      '<input id="' + id + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || 'Search…') + '" class="inp pl-9 w-72" /></div>';
  }
  function table(headers, rows) {
    return '<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-400"><tr>' +
      headers.map((h) => '<th class="th ' + (h.align === 'right' ? 'text-right' : h.align === 'center' ? 'text-center' : '') + '">' + esc(h.label) + '</th>').join('') +
      '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  // ── dashboard ───────────────────────────────────────────────────────────
  let charts = [];

    el('view').innerHTML =
      '<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">' +
        cardBox('Total Clinics', num(c.totalClinics), 'All time') +
        cardBox('Active Clinics', num(c.activeClinics), 'Billing normally', 'text-emerald-500') +
        cardBox('Trial Clinics', num(c.trialClinics), 'On free trial', 'text-brand-900') +
        cardBox('Suspended', num(c.suspendedClinics), 'Suspended / disabled', 'text-amber-500') +

        cardBox('Total Patients', num(c.totalPatients)) +

            ? '<ul class="divide-y divide-slate-100">' + s.systemAlerts.map((a) => '<li class="px-5 py-3 flex items-center justify-between text-sm"><span>' + esc(a.clinicName) + '</span>' + statusBadge(a.status) + '</li>').join('') + '</ul>'
            : '<div class="px-5 py-6 text-sm text-slate-400">No alerts. All clinics healthy.</div>') + '</div>' +
        '<div class="card overflow-hidden"><div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-700">Quick Actions</div>' +
          '<div class="p-5 flex flex-wrap gap-2">' +
            '<a href="#/clinics" class="btn btn-primary">Manage Clinics</a>' +
            '<a href="#/subscriptions" class="btn btn-ghost">Subscriptions</a>' +
            '<a href="#/audit-logs" class="btn btn-ghost">Audit Logs</a>' +
            '<a href="#/plans" class="btn btn-ghost">Plans</a>' +
          '</div></div>' +
      '</div>';

    charts.forEach((ch) => { try { ch.destroy(); } catch (_) {} });
    charts = [];
    const g = s.charts.clinicGrowth, rv = s.charts.revenueGrowth;
    const baseOpts = { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } };
    charts.push(new Chart(el('chGrowth'), { type: 'line', data: { labels: g.map((x) => x.month), datasets: [{ data: g.map((x) => x.count), borderColor: '#92CAED', backgroundColor: 'rgba(146,202,237,.25)', fill: true, tension: .35, pointRadius: 2 }] }, options: baseOpts }));
    charts.push(new Chart(el('chRevenue'), { type: 'bar', data: { labels: rv.map((x) => x.month), datasets: [{ data: rv.map((x) => x.amount), backgroundColor: '#55ace2', borderRadius: 6 }] }, options: baseOpts }));

  function simpleClinicTable(rows, showExpiry) {
    if (!rows || !rows.length) return '<div class="px-5 py-6 text-sm text-slate-400">Nothing here yet.</div>';
    return '<table class="w-full text-sm"><tbody>' + rows.map((r) =>
      '<tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer" onclick="location.hash=\'#/clinics\';setTimeout(()=>window.__openClinic(' + r.id + '),350)">' +
        '<td class="px-5 py-3"><div class="font-semibold text-slate-700">' + esc(r.clinicName) + '</div><div class="text-xs text-slate-400">' + esc(r.ownerName || r.ownerEmail || 'No owner') + '</div></td>' +
        '<td class="px-5 py-3 text-right">' + (showExpiry ? '<div class="text-xs text-slate-500">' + dateFmt(r.subscriptionExpiry) + '</div>' + statusBadge(r.status) : statusBadge(r.status)) + '</td>' +
      '</tr>').join('') + '</tbody></table>';
  }

  // ── clinics ─────────────────────────────────────────────────────────────
  let clinicsState = { page: 1, search: '', status: '', plan: '', total: 0, pageSize: 20 };

  async function viewClinics() {
    el('view').innerHTML =
      toolbar(
        searchInput('cl_search', clinicsState.search, 'Search clinic, owner, email…') +
        '<select id="cl_status" class="inp w-40"><option value="">All statuses</option>' +
          ['active', 'trial', 'suspended', 'disabled'].map((s) => '<option value="' + s + '"' + (clinicsState.status === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>' +
        '<button id="cl_new" class="btn btn-primary ml-auto">' + icon('plus', 'w-4 h-4') + ' Add Clinic</button>'
      ) +
      '<div id="cl_table">' + spinner() + '</div>' +
      '<div id="cl_pager" class="flex items-center justify-between mt-4 text-sm text-slate-500"></div>';
    el('cl_search').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clinicsState.search = e.target.value; clinicsState.page = 1; loadClinics(); } });
    el('cl_status').addEventListener('change', (e) => { clinicsState.status = e.target.value; clinicsState.page = 1; loadClinics(); });
    el('cl_new').addEventListener('click', openClinicForm);
    loadClinics();
  }

  async function loadClinics() {
    const q = new URLSearchParams({ page: clinicsState.page, pageSize: clinicsState.pageSize, search: clinicsState.search, status: clinicsState.status, plan: clinicsState.plan });
    const res = await api('/clinics?' + q.toString());
    clinicsState.total = res.total;
    const rows = res.data.map((c) =>
      '<tr class="border-b border-slate-50 hover:bg-slate-50/60">' +
        '<td class="td"><div class="font-semibold text-slate-700">' + esc(c.clinicName) + '</div><div class="text-xs text-slate-400">#' + c.id + ' · ' + esc(c.ownerName || '—') + '</div></td>' +
        '<td class="td text-xs text-slate-500"><div>' + esc(c.ownerEmail || '—') + '</div><div>' + esc(c.ownerPhone || '') + '</div></td>' +
        '<td class="td text-center text-slate-600">' + num(c.clientsCount) + '</td>' +
        '<td class="td text-center text-slate-600">' + num(c.patientsCount) + '</td>' +
        '<td class="td text-sm"><span class="rounded-md bg-slate-100 px-2 py-0.5 text-xs font-semibold uppercase">' + esc(c.plan) + '</span></td>' +
        '<td class="td text-xs text-slate-500">' + dateFmt(c.subscriptionExpiry) + '</td>' +
        '<td class="td">' + statusBadge(c.status) + '</td>' +
        '<td class="td text-right whitespace-nowrap">' +
          '<button data-id="' + c.id + '" class="cl-view btn btn-ghost !py-1 !px-3 text-xs">Manage</button> ' +
          '<button data-id="' + c.id + '" class="cl-imp btn btn-ghost !py-1 !px-3 text-xs !border-brand-300 !text-brand-950">Login as</button>' +
        '</td>' +
      '</tr>').join('') || emptyRow(8, 'No clinics found.');
    el('cl_table').innerHTML = table([
      { label: 'Clinic' }, { label: 'Contact' }, { label: 'Clients', align: 'center' }, { label: 'Patients', align: 'center' },
      { label: 'Plan' }, { label: 'Expiry' }, { label: 'Status' }, { label: 'Actions', align: 'right' },
    ], rows);
    el('cl_table').querySelectorAll('.cl-view').forEach((b) => b.onclick = () => openClinic(Number(b.dataset.id)));
    el('cl_table').querySelectorAll('.cl-imp').forEach((b) => b.onclick = () => impersonate(Number(b.dataset.id)));
    const tp = res.totalPages || 1;
    el('cl_pager').innerHTML = '<div>Showing ' + num((clinicsState.page - 1) * clinicsState.pageSize + 1) + '–' + num(Math.min(clinicsState.page * clinicsState.pageSize, res.total)) + ' of ' + num(res.total) + '</div>' +
      '<div class="flex gap-2"><button id="pg_prev" class="btn btn-ghost !py-1 ' + (clinicsState.page <= 1 ? 'opacity-40 pointer-events-none' : '') + '">Prev</button>' +
      '<span class="px-2 py-1">' + clinicsState.page + ' / ' + tp + '</span>' +
      '<button id="pg_next" class="btn btn-ghost !py-1 ' + (clinicsState.page >= tp ? 'opacity-40 pointer-events-none' : '') + '">Next</button></div>';
    el('pg_prev').onclick = () => { clinicsState.page--; loadClinics(); };
    el('pg_next').onclick = () => { clinicsState.page++; loadClinics(); };
  }

  async function openClinicForm() {
    let plans = [];
    try { plans = (await api('/plans')).data; } catch (_) {}
    openModal(
      '<div class="p-6">' +
        '<h3 class="text-lg font-bold text-slate-800 mb-4">Add Clinic</h3>' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div class="col-span-2"><label class="lbl">Clinic name *</label><input id="f_clinic" class="inp" /></div>' +
          '<div><label class="lbl">Owner name</label><input id="f_owner" class="inp" /></div>' +
          '<div><label class="lbl">Owner username *</label><input id="f_user" class="inp" /></div>' +
          '<div><label class="lbl">Owner email</label><input id="f_email" class="inp" /></div>' +
          '<div><label class="lbl">Owner phone</label><input id="f_phone" class="inp" /></div>' +
          '<div><label class="lbl">Plan</label><select id="f_plan" class="inp">' + plans.map((p) => '<option value="' + esc(p.code) + '"' + (p.code === 'trial' ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>' +
          '<div><label class="lbl">Status</label><select id="f_status" class="inp"><option value="trial" selected>trial</option><option value="active">active</option></select></div>' +
          '<div class="col-span-2"><label class="lbl">Address</label><input id="f_addr" class="inp" /></div>' +
          '<div><label class="lbl">City</label><input id="f_city" class="inp" /></div>' +
          '<div><label class="lbl">Country</label><input id="f_country" class="inp" /></div>' +
          '<div class="col-span-2 text-xs text-slate-400">Owner password is auto-generated if left blank (shown once after creation).</div>' +
        '</div>' +
        '<div id="f_err" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2 mt-3"></div>' +
        '<div class="flex justify-end gap-2 mt-5"><button onclick="__closeModal()" class="btn btn-ghost">Cancel</button>' +
          '<button id="f_save" class="btn btn-primary">Create clinic</button></div>' +
      '</div>');
    el('f_save').onclick = async () => {
      const payload = {
        clinicName: el('f_clinic').value.trim(), ownerName: el('f_owner').value.trim(),
        ownerUsername: el('f_user').value.trim(), ownerEmail: el('f_email').value.trim(),
        ownerPhone: el('f_phone').value.trim(), plan: el('f_plan').value, status: el('f_status').value,
        address: el('f_addr').value.trim(), city: el('f_city').value.trim(), country: el('f_country').value.trim(),
      };
      if (!payload.clinicName || !payload.ownerUsername) { el('f_err').textContent = 'Clinic name and owner username are required.'; el('f_err').classList.remove('hidden'); return; }
      el('f_save').disabled = true; el('f_save').textContent = 'Creating…';
      try {
        const r = await api('/clinics', { method: 'POST', body: payload });
        closeModal();
        if (r.owner && r.owner.password) {
          openModal('<div class="p-6"><h3 class="text-lg font-bold text-slate-800">Clinic created</h3>' +
            '<p class="text-sm text-slate-500 mt-2">Share these credentials with the clinic owner. The password is shown only once.</p>' +
            '<div class="mt-4 rounded-xl bg-slate-900 text-slate-100 p-4 font-mono text-sm">' +
              '<div>URL: <span class="text-brand-400">/app</span></div>' +
              '<div>username: <span class="text-brand-400">' + esc(r.owner.username) + '</span></div>' +
              '<div>password: <span class="text-brand-400">' + esc(r.owner.password) + '</span></div></div>' +
            '<div class="flex justify-end mt-5"><button onclick="__closeModal()" class="btn btn-primary">Done</button></div></div>');
        } else toast('Clinic created');
        clinicsState.page = 1; loadClinics();
      } catch (e) { el('f_err').textContent = e.message; el('f_err').classList.remove('hidden'); }
      finally { if (el('f_save')) { el('f_save').disabled = false; el('f_save').textContent = 'Create clinic'; } }
    };
  }

          '</div>' +
          '<div class="grid lg:grid-cols-2 gap-6 mt-6">' +

  async function impersonate(id) {

    try {
      const r = await api('/clinics/' + id + '/impersonate', { method: 'POST', body: {} });

  };

  function cellValue(key, v) {
    if (v === undefined || v === null || v === '') return '—';
    if (typeof v === 'boolean') return statusBadge(v ? 'active' : 'disabled');
    if (/^(status|priority|level|engagement|expiryState)$/.test(key)) return statusBadge(v);
    if (/amount|price|value|mrr|arr|total/i.test(key) && !isNaN(Number(v))) return money(v);
    if (/At$|Date|date|Expiry|expiry/.test(key)) { const d = new Date(v); return isNaN(d) ? esc(v) : dateFmt(v); }
    return esc(v);
  }

      '<tr class="border-b border-slate-50 hover:bg-slate-50/60">' +

  function recordForm(col, rec) {
    const cfg = RECORDS[col];
    const isEdit = !!rec;
    const fieldHtml = cfg.fields.map((f) => {
      const val = rec ? rec[f.k] : (f.d !== undefined ? f.d : '');
      if (f.t === 'textarea') return '<div class="col-span-2"><label class="lbl">' + esc(f.l) + '</label><textarea data-k="' + f.k + '" rows="3" class="inp">' + esc(val || '') + '</textarea></div>';
      if (f.t === 'select') return '<div><label class="lbl">' + esc(f.l) + '</label><select data-k="' + f.k + '" class="inp">' + (f.o || []).map((o) => '<option value="' + esc(o) + '"' + (String(val) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
      if (f.t === 'bool') return '<div class="flex items-center gap-2 pt-5"><input type="checkbox" data-k="' + f.k + '" data-bool="1" ' + (val ? 'checked' : '') + ' class="rounded border-slate-300" /><label class="text-sm text-slate-600">' + esc(f.l) + '</label></div>';
      const type = f.t === 'number' ? 'number' : f.t === 'date' ? 'date' : f.t === 'datetime' ? 'datetime-local' : 'text';
      const v = f.t === 'datetime' && val ? String(val).slice(0, 16) : val;
      return '<div><label class="lbl">' + esc(f.l) + (f.req ? ' *' : '') + '</label><input data-k="' + f.k + '" type="' + type + '" value="' + esc(v || '') + '" placeholder="' + esc(f.ph || '') + '" class="inp" /></div>';
    }).join('');
    openModal('<div class="p-6"><h3 class="text-lg font-bold text-slate-800 mb-4">' + (isEdit ? 'Edit' : 'New') + ' ' + esc(cfg.singular) + '</h3>' +
      '<div class="grid grid-cols-2 gap-3" id="rf">' + fieldHtml + '</div>' +
      '<div id="rf_err" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2 mt-3"></div>' +
      '<div class="flex justify-end gap-2 mt-5"><button onclick="__closeModal()" class="btn btn-ghost">Cancel</button><button id="rf_save" class="btn btn-primary">' + (isEdit ? 'Save' : 'Create') + '</button></div></div>');
    el('rf_save').onclick = async () => {
      const body = {};
      el('rf').querySelectorAll('[data-k]').forEach((inp) => {
        const k = inp.dataset.k;
        if (inp.dataset.bool) body[k] = inp.checked;
        else if (inp.type === 'number') body[k] = inp.value === '' ? null : Number(inp.value);
        else body[k] = inp.value.trim();
      });
      const missing = cfg.fields.find((f) => f.req && (body[f.k] === '' || body[f.k] == null));
      if (missing) { el('rf_err').textContent = missing.l + ' is required.'; el('rf_err').classList.remove('hidden'); return; }
      try {
        if (isEdit) await api('/records/' + col + '/' + rec.id, { method: 'PUT', body });
        else await api('/records/' + col, { method: 'POST', body });
        closeModal(); toast(isEdit ? 'Updated' : 'Created'); viewRecords(col);
      } catch (e) { el('rf_err').textContent = e.message; el('rf_err').classList.remove('hidden'); }
    };
  }

      { k: 'whiteLabel', l: 'White-label mode', t: 'bool', d: false },
    ],
    security: [
      { k: 'minPasswordLength', l: 'Minimum password length', t: 'number', d: 8 },
      { k: 'requireUppercase', l: 'Require uppercase letter', t: 'bool', d: true },
      { k: 'requireNumber', l: 'Require number', t: 'bool', d: true },
      { k: 'requireSymbol', l: 'Require symbol', t: 'bool', d: false },
      { k: 'sessionTimeoutMinutes', l: 'Session timeout (minutes)', t: 'number', d: 720 },
      { k: 'maxFailedLogins', l: 'Max failed logins before lockout', t: 'number', d: 5 },
      { k: 'twoFactor', l: 'Require 2FA for platform staff', t: 'bool', d: false },
      { k: 'ipAllowlist', l: 'IP allowlist (comma separated)', d: '' },
    ],
    notifications: [
      { k: 'emailEnabled', l: 'Email notifications', t: 'bool', d: true },
      { k: 'smsEnabled', l: 'SMS notifications', t: 'bool', d: false },
      { k: 'whatsappEnabled', l: 'WhatsApp notifications', t: 'bool', d: false },
      { k: 'inAppEnabled', l: 'In-app notifications', t: 'bool', d: true },
      { k: 'pushEnabled', l: 'Push notifications', t: 'bool', d: false },
      { k: 'senderName', l: 'Sender name', d: 'PodVet' },
      { k: 'senderEmail', l: 'Sender email', d: 'no-reply@podvet.biztrack.uk' },
      { k: 'notifyOnNewClinic', l: 'Notify on new clinic signup', t: 'bool', d: true },
    ],
    maintenance: [
      { k: 'enabled', l: 'Maintenance mode', t: 'bool', d: false },
      { k: 'message', l: 'Maintenance message', t: 'textarea', d: 'PodVet is undergoing scheduled maintenance. We will be back shortly.' },
      { k: 'scheduledStart', l: 'Scheduled start', t: 'datetime', d: '' },
      { k: 'scheduledEnd', l: 'Scheduled end', t: 'datetime', d: '' },
      { k: 'allowSuperAdmin', l: 'Allow super admins during maintenance', t: 'bool', d: true },
      { k: 'bannerEnabled', l: 'Show platform-wide banner', t: 'bool', d: false },
      { k: 'bannerText', l: 'Banner text', d: '' },
    ],
  };

  async function viewSettings(key) {
    el('view').innerHTML = spinner();
    const res = await api('/settings');
    const schema = SETTINGS_SCHEMA[key] || [];
    const current = res.data[key] || {};
    el('view').innerHTML =
      '<div class="card p-6 max-w-3xl"><div class="grid grid-cols-2 gap-4" id="st_form">' +
        schema.map((f) => {
          const val = current[f.k] !== undefined ? current[f.k] : f.d;
          if (f.t === 'bool') return '<div class="flex items-center gap-2 pt-5"><input type="checkbox" data-k="' + f.k + '" data-bool="1" ' + (val ? 'checked' : '') + ' class="rounded border-slate-300" /><label class="text-sm text-slate-600">' + esc(f.l) + '</label></div>';
          if (f.t === 'textarea') return '<div class="col-span-2"><label class="lbl">' + esc(f.l) + '</label><textarea data-k="' + f.k + '" rows="3" class="inp">' + esc(val || '') + '</textarea></div>';
          if (f.t === 'select') return '<div><label class="lbl">' + esc(f.l) + '</label><select data-k="' + f.k + '" class="inp">' + (f.o || []).map((o) => '<option value="' + esc(o) + '"' + (String(val) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
          const type = f.t === 'number' ? 'number' : f.t === 'datetime' ? 'datetime-local' : 'text';
          const v = f.t === 'datetime' && val ? String(val).slice(0, 16) : val;
          return '<div><label class="lbl">' + esc(f.l) + '</label><input data-k="' + f.k + '" type="' + type + '" value="' + esc(v || '') + '" class="inp" /></div>';
        }).join('') +
      '</div>' +
      '<div class="flex items-center justify-between mt-6">' +
        '<span class="text-xs text-slate-400">' + (res.updatedAt && res.updatedAt[key] ? 'Last updated ' + dtFmt(res.updatedAt[key]) : 'Not configured yet') + '</span>' +
        '<button id="st_save" class="btn btn-primary">Save settings</button>' +
      '</div></div>';
    el('st_save').onclick = async () => {
      const body = {};
      el('st_form').querySelectorAll('[data-k]').forEach((inp) => {
        const k = inp.dataset.k;
        if (inp.dataset.bool) body[k] = inp.checked;
        else if (inp.type === 'number') body[k] = inp.value === '' ? null : Number(inp.value);
        else body[k] = inp.value.trim();
      });
      try { await api('/settings', { method: 'PUT', body: { [key]: body } }); toast('Settings saved'); viewSettings(key); }
      catch (e) { toast(e.message, 'error'); }
    };
  }

  // ── account ─────────────────────────────────────────────────────────────
  async function viewAccount() {
    el('view').innerHTML =
      '<div class="max-w-lg card p-6">' +
        '<h3 class="font-semibold text-slate-700 mb-1">' + esc(admin.name) + '</h3>' +
        '<p class="text-sm text-slate-400 mb-4">' + esc(admin.username) + ' · ' + esc(admin.role) + '</p>' +
        '<h4 class="font-semibold text-slate-700 mt-4 mb-2">Change password</h4>' +
        '<div class="space-y-3">' +
          '<input id="p_cur" type="password" class="inp" placeholder="Current password" />' +
          '<input id="p_new" type="password" class="inp" placeholder="New password (min 8 chars)" />' +
          '<div id="p_err" class="hidden text-sm text-red-600"></div>' +
          '<button id="p_save" class="btn btn-primary">Update password</button>' +
        '</div></div>';
    el('p_save').onclick = async () => {
      try {
        await api('/change-password', { method: 'POST', body: { currentPassword: el('p_cur').value, newPassword: el('p_new').value } });
        el('p_cur').value = ''; el('p_new').value = ''; toast('Password updated');
      } catch (e) { el('p_err').textContent = e.message; el('p_err').classList.remove('hidden'); }
    };
  }

  // ── router ──────────────────────────────────────────────────────────────
  const VIEWS = {
    dashboard: viewDashboard, clinics: viewClinics, plans: viewPlans, roles: viewRoles,
    admins: viewAdmins, 'audit-logs': viewAudit, account: viewAccount,
    branches: viewBranches, users: viewUsers, subscriptions: viewSubscriptions,
    billing: viewBilling, transactions: viewTransactions,
    coupons: () => viewRecords('coupons'), features: () => viewRecords('features'),
    integrations: () => viewRecords('integrations'), templates: () => viewRecords('templates'),
    announcements: () => viewRecords('announcements'), support: () => viewRecords('support'),
    feedback: () => viewRecords('feedback'),
    reports: viewReports, 'usage-analytics': viewUsageAnalytics,
    'revenue-analytics': viewRevenueAnalytics, 'clinic-analytics': viewClinicAnalytics,
    'login-logs': viewLoginLogs, sessions: viewSessions, storage: viewStorage,
    backups: viewBackups, 'system-health': viewSystemHealth, 'error-logs': viewErrorLogs,
    settings: () => viewSettings('general'), branding: () => viewSettings('branding'),
    'security-settings': () => viewSettings('security'), notifications: () => viewSettings('notifications'),
    maintenance: () => viewSettings('maintenance'),
  };

  async function render() {
    const route = currentRoute();
    renderNav();
    const t = TITLES[route] || [route.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()), ''];
    el('pageTitle').textContent = t[0];
    el('pageSub').textContent = t[1] || '';
    try {
      if (route === 'logout') { doLogout(true); return; }
      const fn = VIEWS[route] || viewDashboard;
      return await fn();
    } catch (e) {
      el('view').innerHTML = '<div class="bg-red-50 border border-red-100 text-red-700 rounded-xl p-4">' + esc(e.message) + '</div>';
    }
  }

  // ── auth ────────────────────────────────────────────────────────────────
  // No separate super-admin login: /app is the one role-detecting sign-in page.
  function showLogin() {
    location.replace('/app?next=' + encodeURIComponent('/super-admin'));
  }
  function showApp() {
    el('app').classList.remove('hidden');
    el('avatar').textContent = (admin.name || 'S').charAt(0).toUpperCase();
    el('brandMark').innerHTML = icon('userCog', 'w-5 h-5');
    el('refreshBtn').innerHTML = icon('refresh', 'w-4 h-4');
    el('who').innerHTML = '<div class="font-semibold text-slate-700 text-sm">' + esc(admin.name) + '</div><div class="text-xs text-slate-400">' + esc(admin.role) + '</div>';
  }
  function doLogout(hitServer) {
    if (hitServer && token) { api('/logout', { method: 'POST', body: {} }).catch(() => {}); }
    token = ''; admin = null; localStorage.removeItem(TOKEN_KEY);
    location.replace('/app');
  }
  window.__logout = doLogout;

  el('refreshBtn').addEventListener('click', render);
  window.addEventListener('hashchange', render);

  (async function boot() {
    if (!token) return showLogin();
    try {
      const me = await api('/me');
      admin = me.admin; showApp(); render();
    } catch (_) { doLogout(false); }
  })();
})();
</script>
</body>
</html>
