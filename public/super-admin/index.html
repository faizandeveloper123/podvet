<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PodVet · Super Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { brand: {
      50: '#f6fbfe', 100: '#f6fbfe', 200: '#f2f9fd', 300: '#dceef9',
      400: '#c2e1f5', 500: '#92CAED', 600: '#6fb9e7', 700: '#55ace2',
      800: '#3b9fde', 900: '#2492d6', 950: '#1f7db7', dark: '#1b6ea1',
    } } } },
  };
</script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  /* PodVet brand theme (#92CAED) — remap the indigo accents used across the UI */
  .nav-item.active { background: #92CAED; color: #0f172a; font-weight: 600; }
  .bg-indigo-600 { background-color: #92CAED !important; }
  .bg-indigo-600.text-white, .bg-indigo-600 .text-white { color: #0f172a !important; }
  .hover\:bg-indigo-700:hover { background-color: #6fb9e7 !important; }
  .text-indigo-600 { color: #1f7db7 !important; }
  .text-indigo-500 { color: #3b9fde !important; }
  .text-indigo-400 { color: #55ace2 !important; }
  .border-indigo-200 { border-color: #92CAED !important; }
  .bg-indigo-50 { background-color: #f0f9fe !important; }
  .hover\:bg-indigo-50:hover { background-color: #eaf6fd !important; }
  .focus\:ring-indigo-500:focus { --tw-ring-color: #92CAED !important; }
  .rounded.text-indigo-600 { color: #1f7db7 !important; }
  .lbl { display: block; font-size: .75rem; font-weight: 600; color: #64748b; margin-bottom: .25rem; }
  .inp { width: 100%; border: 1px solid #e2e8f0; border-radius: .75rem; padding: .5rem .75rem; font-size: .875rem; outline: none; background: #fff; }
  .inp:focus { box-shadow: 0 0 0 2px rgba(99,102,241,.5); border-color: #6366f1; }
  .fade-in { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  [x-cloak] { display: none !important; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<!-- ── LOGIN ─────────────────────────────────────────────────────────────── -->
<div id="login" class="hidden min-h-screen items-center justify-center bg-slate-900 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-5xl">🐾</div>
      <h1 class="mt-3 text-3xl font-bold text-white tracking-tight">PodVet</h1>
      <p class="text-slate-400 text-sm mt-1">Platform Super Admin</p>
    </div>
    <form id="loginForm" class="bg-white rounded-2xl shadow-xl p-8 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Username or Email</label>
        <input id="li_user" autocomplete="username" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="superadmin" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
        <input id="li_pass" type="password" autocomplete="current-password" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
      </div>
      <div id="loginErr" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></div>
      <button id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl py-2.5 transition">Sign in</button>
      <p class="text-center text-xs text-slate-400">Restricted to platform staff. All actions are audit-logged.</p>
    </form>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────────────────── -->
<div id="app" class="hidden min-h-screen">
  <div class="flex h-screen overflow-hidden">
    <!-- sidebar -->
    <aside id="sidebar" class="w-64 shrink-0 bg-slate-900 text-slate-300 flex flex-col">
      <div class="h-16 flex items-center gap-2 px-5 border-b border-white/5">
        <span class="text-2xl">🐾</span>
        <div>
          <div class="text-white font-bold leading-none">PodVet</div>
          <div class="text-[10px] uppercase tracking-widest text-indigo-400">Super Admin</div>
        </div>
      </div>
      <nav id="nav" class="flex-1 overflow-y-auto px-3 py-4 space-y-4"></nav>
      <div class="p-3 border-t border-white/5">
        <div id="who" class="text-xs text-slate-400 px-2 py-1"></div>
      </div>
    </aside>
    <!-- main -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 shrink-0 bg-white border-b border-slate-200 flex items-center justify-between px-6">
        <div>
          <h2 id="pageTitle" class="text-lg font-bold text-slate-800">Dashboard</h2>
          <p id="pageSub" class="text-xs text-slate-400"></p>
        </div>
        <div class="flex items-center gap-3">
          <button id="refreshBtn" class="text-sm rounded-lg border border-slate-200 px-3 py-1.5 hover:bg-slate-50">Refresh</button>
          <div class="w-9 h-9 rounded-full bg-indigo-600 text-white grid place-items-center font-semibold" id="avatar">S</div>
        </div>
      </header>
      <div id="view" class="flex-1 overflow-y-auto p-6 fade-in"></div>
    </main>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4"></div>
<div id="toast" class="hidden fixed bottom-5 right-5 z-[60] rounded-xl px-4 py-3 text-sm font-medium shadow-lg"></div>

<script>
(function () {
  'use strict';
  const TOKEN_KEY = 'podvet_super_token';
  const SESS_KEY = 'podvet_session';
  let token = localStorage.getItem(TOKEN_KEY) || '';
  let admin = null;

  const $ = (sel, root) => (root || document).querySelector(sel);
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '£' + Number(n || 0).toLocaleString('en-GB', { maximumFractionDigits: 0 });
  const num = (n) => Number(n || 0).toLocaleString('en-GB');
  const dateFmt = (d) => (d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—');
  const dtFmt = (d) => (d ? new Date(d).toLocaleString('en-GB') : '—');

  function toast(msg, type) {
    const t = el('toast');
    t.textContent = msg;
    t.className = 'fixed bottom-5 right-5 z-[60] rounded-xl px-4 py-3 text-sm font-medium shadow-lg ' +
      (type === 'error' ? 'bg-red-600 text-white' : type === 'warn' ? 'bg-amber-500 text-white' : 'bg-slate-900 text-white');
    t.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.add('hidden'), 3200);
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch('/api/super-admin' + path, Object.assign({}, opts, { headers, body: opts.body ? JSON.stringify(opts.body) : undefined }));
    let body = null;
    try { body = await res.json(); } catch (_) {}
    if (res.status === 401) { doLogout(false); throw new Error('Session expired'); }
    if (!res.ok) throw new Error((body && body.error && body.error.message) || ('Request failed (' + res.status + ')'));
    return body;
  }

  // ── nav ─────────────────────────────────────────────────────────────────
  const NAV = [
    { group: '', items: [{ id: 'dashboard', label: 'Dashboard', icon: '◎' }] },
    { group: 'Management', items: [
      { id: 'clinics', label: 'Clinics', icon: '🏥' },
      { id: 'branches', label: 'Branches', icon: '🏢' },
      { id: 'users', label: 'Users', icon: '👥' },
      { id: 'roles', label: 'Roles & Permissions', icon: '🔑' },
    ] },
    { group: 'Subscriptions', items: [
      { id: 'plans', label: 'Plans', icon: '📦' },
      { id: 'subscriptions', label: 'Subscriptions', icon: '🔄' },
      { id: 'billing', label: 'Billing', icon: '🧾' },
      { id: 'transactions', label: 'Transactions', icon: '💳' },
      { id: 'coupons', label: 'Coupons', icon: '🏷️' },
    ] },
    { group: 'Platform', items: [
      { id: 'features', label: 'Features', icon: '🧩' },
      { id: 'integrations', label: 'Integrations', icon: '🔌' },
      { id: 'notifications', label: 'Notifications', icon: '🔔' },
      { id: 'templates', label: 'Templates', icon: '📝' },
      { id: 'announcements', label: 'Announcements', icon: '📣' },
    ] },
    { group: 'Analytics', items: [
      { id: 'reports', label: 'Reports', icon: '📊' },
      { id: 'usage-analytics', label: 'Usage Analytics', icon: '📈' },
      { id: 'revenue-analytics', label: 'Revenue Analytics', icon: '💰' },
      { id: 'clinic-analytics', label: 'Clinic Analytics', icon: '🏥' },
    ] },
    { group: 'Support', items: [
      { id: 'support', label: 'Support Tickets', icon: '🎫' },
      { id: 'feedback', label: 'Feedback', icon: '💬' },
    ] },
    { group: 'Security', items: [
      { id: 'audit-logs', label: 'Audit Logs', icon: '📜' },
      { id: 'login-logs', label: 'Login Logs', icon: '🔓' },
      { id: 'sessions', label: 'Sessions', icon: '🖥️' },
      { id: 'security-settings', label: 'Security Settings', icon: '🛡️' },
    ] },
    { group: 'System', items: [
      { id: 'settings', label: 'General Settings', icon: '⚙️' },
      { id: 'branding', label: 'Branding', icon: '🎨' },
      { id: 'storage', label: 'Storage', icon: '💾' },
      { id: 'backups', label: 'Backups', icon: '🗄️' },
      { id: 'system-health', label: 'System Health', icon: '❤️' },
      { id: 'error-logs', label: 'Error Logs', icon: '⚠️' },
      { id: 'maintenance', label: 'Maintenance', icon: '🔧' },
    ] },
    { group: 'Account', items: [
      { id: 'account', label: 'Profile', icon: '🙍' },
      { id: 'admins', label: 'Super Admin Users', icon: '🧑‍💼' },
      { id: 'logout', label: 'Logout', icon: '🚪' },
    ] },
  ];

  const IMPLEMENTED = ['dashboard', 'clinics', 'plans', 'roles', 'admins', 'audit-logs', 'account'];

  const TITLES = {
    dashboard: ['Dashboard', 'Platform overview'],
    clinics: ['Clinics', 'Master control for every registered veterinary clinic'],
    plans: ['Subscription Plans', 'Pricing and limits per plan'],
    roles: ['Roles & Permissions', 'Module-wise access control'],
    admins: ['Super Admin Users', 'Platform staff accounts'],
    'audit-logs': ['Audit Logs', 'Every platform action, who did what and when'],
    account: ['Profile', 'Your super admin account'],
  };

  function renderNav() {
    const nav = el('nav');
    nav.innerHTML = NAV.map((g, gi) => {
      const items = g.items.map((it) => {
        const active = currentRoute() === it.id ? 'active' : '';
        const soon = IMPLEMENTED.includes(it.id) ? '' : ' <span class="text-[9px] uppercase tracking-wide text-slate-500 ml-auto">soon</span>';
        return `<a href="#/${it.id}" class="nav-item ${active} flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm hover:bg-white/10 cursor-pointer"><span class="w-5 text-center">${it.icon}</span><span class="flex-1">${esc(it.label)}</span>${soon}</a>`;
      }).join('');
      return `<div><div class="px-3 mb-1 text-[10px] font-bold uppercase tracking-widest text-slate-500">${esc(g.group || 'Overview')}</div><div class="space-y-0.5">${items}</div></div>`;
    }).join('');
    nav.querySelectorAll('a').forEach((a) => a.addEventListener('click', (e) => {
      const id = a.getAttribute('href').slice(2);
      if (id === 'logout') { e.preventDefault(); doLogout(true); }
    }));
  }

  function currentRoute() {
    const h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    return h || 'dashboard';
  }

  // ── modal / confirm ─────────────────────────────────────────────────────
  function openModal(html, wide) {
    const m = el('modal');
    m.innerHTML = `<div class="bg-white rounded-2xl shadow-2xl w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[90vh] overflow-y-auto fade-in">${html}</div>`;
    m.classList.remove('hidden'); m.classList.add('flex');
    m.onclick = (e) => { if (e.target === m) closeModal(); };
  }
  function closeModal() { const m = el('modal'); m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; }
  window.__closeModal = closeModal;

  function confirmDialog(title, message, danger) {
    return new Promise((resolve) => {
      openModal(`
        <div class="p-6">
          <h3 class="text-lg font-bold text-slate-800">${esc(title)}</h3>
          <p class="text-sm text-slate-500 mt-2">${message}</p>
          <div class="flex justify-end gap-2 mt-6">
            <button id="cf_no" class="rounded-lg border border-slate-200 px-4 py-2 text-sm hover:bg-slate-50">Cancel</button>
            <button id="cf_yes" class="rounded-lg ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white px-4 py-2 text-sm font-semibold">Confirm</button>
          </div>
        </div>`);
      el('cf_no').onclick = () => { closeModal(); resolve(false); };
      el('cf_yes').onclick = () => { closeModal(); resolve(true); };
    });
  }

  function statusBadge(s) {
    const map = { active: 'bg-emerald-50 text-emerald-700 border-emerald-200', trial: 'bg-sky-50 text-sky-700 border-sky-200', suspended: 'bg-amber-50 text-amber-700 border-amber-200', disabled: 'bg-red-50 text-red-700 border-red-200' };
    return `<span class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-semibold ${map[s] || 'bg-slate-50 text-slate-600 border-slate-200'}">${esc(s || 'unknown')}</span>`;
  }

  // ── views ───────────────────────────────────────────────────────────────
  let charts = [];

  async function viewDashboard() {
    el('view').innerHTML = spinner();
    const s = await api('/stats');
    const c = s.cards;
    const card = (label, value, tone, sub) => `
      <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
        <div class="text-xs font-semibold uppercase tracking-wide text-slate-400">${esc(label)}</div>
        <div class="text-2xl font-bold text-slate-800 mt-1">${value}</div>
        ${sub ? `<div class="text-xs mt-1 ${tone || 'text-slate-400'}">${sub}</div>` : ''}
      </div>`;
    el('view').innerHTML = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        ${card('Total Clinics', num(c.totalClinics), '', 'All time')}
        ${card('Active Clinics', num(c.activeClinics), 'text-emerald-500', 'Billing normally')}
        ${card('Trial Clinics', num(c.trialClinics), 'text-sky-500', 'On free trial')}
        ${card('Suspended', num(c.suspendedClinics), 'text-amber-500', 'Suspended / disabled')}
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
        ${card('Total Users', num(c.totalUsers))}
        ${card('Total Patients', num(c.totalPatients))}
        ${card('Appointments', num(c.totalAppointments))}
        ${card('MRR', money(c.mrr), 'text-indigo-500', 'Monthly recurring revenue')}
      </div>
      <div class="grid lg:grid-cols-2 gap-4 mt-4">
        <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
          <div class="font-semibold text-slate-700 mb-3">Clinic Growth</div>
          <canvas id="chGrowth" height="120"></canvas>
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
          <div class="font-semibold text-slate-700 mb-3">Revenue Growth (MRR)</div>
          <canvas id="chRevenue" height="120"></canvas>
        </div>
      </div>
      <div class="grid lg:grid-cols-2 gap-4 mt-4">
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-700">Recent Clinics</div>
          ${simpleClinicTable(s.recentClinics)}
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-700">Expiring Subscriptions <span class="text-xs text-slate-400">(30 days)</span></div>
          ${simpleClinicTable(s.expiringSubscriptions, true)}
        </div>
      </div>
      <div class="grid lg:grid-cols-2 gap-4 mt-4">
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-700">System Alerts</div>
          ${s.systemAlerts && s.systemAlerts.length
            ? '<ul class="divide-y divide-slate-100">' + s.systemAlerts.map((a) => `<li class="px-5 py-3 flex items-center justify-between text-sm"><span>${esc(a.clinicName)}</span>${statusBadge(a.status)}</li>`).join('') + '</ul>'
            : '<div class="px-5 py-6 text-sm text-slate-400">No alerts. All clinics healthy.</div>'}
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 font-semibold text-slate-700">Quick Actions</div>
          <div class="p-5 flex flex-wrap gap-2">
            <a href="#/clinics" class="rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2">Manage Clinics</a>
            <a href="#/audit-logs" class="rounded-lg border border-slate-200 text-sm px-4 py-2 hover:bg-slate-50">Audit Logs</a>
            <a href="#/plans" class="rounded-lg border border-slate-200 text-sm px-4 py-2 hover:bg-slate-50">Plans</a>
          </div>
        </div>
      </div>`;

    charts.forEach((ch) => { try { ch.destroy(); } catch (_) {} });
    charts = [];
    const g = s.charts.clinicGrowth, rv = s.charts.revenueGrowth;
    const baseOpts = { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } };
    charts.push(new Chart(el('chGrowth'), { type: 'line', data: { labels: g.map((x) => x.month), datasets: [{ data: g.map((x) => x.count), borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,.12)', fill: true, tension: .35, pointRadius: 2 }] }, options: baseOpts }));
    charts.push(new Chart(el('chRevenue'), { type: 'bar', data: { labels: rv.map((x) => x.month), datasets: [{ data: rv.map((x) => x.amount), backgroundColor: '#10b981', borderRadius: 6 }] }, options: baseOpts }));
  }

  function simpleClinicTable(rows, showExpiry) {
    if (!rows || !rows.length) return '<div class="px-5 py-6 text-sm text-slate-400">Nothing here yet.</div>';
    return `<table class="w-full text-sm"><tbody>` + rows.map((r) => `
      <tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer" onclick="location.hash='#/clinics';setTimeout(()=>window.__openClinic(${r.id}),350)">
        <td class="px-5 py-3">
          <div class="font-semibold text-slate-700">${esc(r.clinicName)}</div>
          <div class="text-xs text-slate-400">${esc(r.ownerName || r.ownerEmail || 'No owner')}</div>
        </td>
        <td class="px-5 py-3 text-right">${showExpiry ? `<div class="text-xs text-slate-500">${dateFmt(r.subscriptionExpiry)}</div>${statusBadge(r.status)}` : statusBadge(r.status)}</td>
      </tr>`).join('') + '</tbody></table>';
  }

  // ── clinics ─────────────────────────────────────────────────────────────
  let clinicsState = { page: 1, search: '', status: '', plan: '', total: 0, pageSize: 20 };

  async function viewClinics() {
    el('view').innerHTML = `
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <input id="cl_search" value="${esc(clinicsState.search)}" placeholder="Search clinic, owner, email…" class="w-72 rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
        <select id="cl_status" class="rounded-xl border border-slate-200 px-3 py-2 text-sm">
          <option value="">All statuses</option>
          ${['active', 'trial', 'suspended', 'disabled'].map((s) => `<option value="${s}" ${clinicsState.status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <button id="cl_new" class="ml-auto rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2">+ Add Clinic</button>
      </div>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div id="cl_table">${spinner()}</div>
      </div>
      <div id="cl_pager" class="flex items-center justify-between mt-4 text-sm text-slate-500"></div>`;
    el('cl_search').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clinicsState.search = e.target.value; clinicsState.page = 1; loadClinics(); } });
    el('cl_status').addEventListener('change', (e) => { clinicsState.status = e.target.value; clinicsState.page = 1; loadClinics(); });
    el('cl_new').addEventListener('click', openClinicForm);
    loadClinics();
  }

  async function loadClinics() {
    const q = new URLSearchParams({ page: clinicsState.page, pageSize: clinicsState.pageSize, search: clinicsState.search, status: clinicsState.status, plan: clinicsState.plan });
    const res = await api('/clinics?' + q.toString());
    clinicsState.total = res.total;
    const rows = res.data.map((c) => `
      <tr class="border-b border-slate-50 hover:bg-slate-50/60">
        <td class="px-4 py-3">

  async function impersonate(id) {
    if (!(await confirmDialog('Login as Clinic Admin', 'You will be signed into this clinic\'s admin panel in a new tab.<br><b>This action is recorded in the audit log.</b>', false))) return;
    try {
      const r = await api(`/clinics/${id}/impersonate`, { method: 'POST', body: {} });
      if (r.accessToken) {
        localStorage.setItem(SESS_KEY, JSON.stringify({
          user: Object.assign({}, r.user, { isPlatformAdmin: false }),
          tokens: { accessToken: r.accessToken, refreshToken: r.refreshToken },
        }));
      }
      window.open('/app', '_blank');
      toast('Opening clinic panel…');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function viewRoles() {
    el('view').innerHTML = spinner();
    const d = await api('/roles');

        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">

          <div id="r_list" class="space-y-1">
            ${d.data.map((r) => `<button data-id="${r.id}" class="r-item w-full text-left rounded-lg px-3 py-2 text-sm hover:bg-slate-50 flex items-center justify-between">
              <span>${esc(r.name)}</span>${r.isSystem ? '<span class="text-[10px] uppercase text-slate-400">system</span>' : '<span class="text-[10px] uppercase text-indigo-500">custom</span>'}</button>`).join('')}

        </div>
        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 id="r_title" class="font-semibold text-slate-700">Select a role</h3>
            <button id="r_save" class="text-xs rounded-lg bg-indigo-600 text-white px-3 py-1.5 hidden">Save permissions</button>
          </div>
          <div id="r_matrix" class="text-sm text-slate-400">Choose a role to edit its module permissions.</div>
        </div>
      </div>`;
    let current = null;
    function selectRole(id) {
      el('r_list').querySelectorAll('.r-item').forEach((b) => b.classList.toggle('bg-indigo-50', Number(b.dataset.id) === id));
      api('/roles/' + id + '/permissions').then((p) => {
        const role = d.data.find((r) => r.id === id);
        el('r_title').textContent = role.name;
        el('r_save').classList.remove('hidden');
        el('r_matrix').innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="text-xs uppercase text-slate-400"><tr><th class="text-left py-2">Module</th>
          ${['view', 'create', 'edit', 'delete', 'export'].map((k) => `<th class="py-2 px-2">${k}</th>`).join('')}</tr></thead>
          <tbody>${p.modules.map((m) => {
            const perm = p.permissions[m] || {};
            return `<tr class="border-t border-slate-50"><td class="py-2 capitalize">${esc(m.replace(/_/g, ' '))}</td>
              ${['view', 'create', 'edit', 'delete', 'export'].map((k) => `<td class="text-center"><input type="checkbox" data-module="${m}" data-perm="${k}" ${perm[k] ? 'checked' : ''} class="rounded text-indigo-600" /></td>`).join('')}</tr>`;
          }).join('')}</tbody></table></div>`;
        current = id;
      }).catch((e) => toast(e.message, 'error'));
    }
    el('r_list').querySelectorAll('.r-item').forEach((b) => b.onclick = () => selectRole(Number(b.dataset.id)));
    el('r_save').onclick = async () => {
      const permissions = {};
      el('r_matrix').querySelectorAll('input[type=checkbox]').forEach((cb) => {
        const m = cb.dataset.module;
        permissions[m] = permissions[m] || {};
        permissions[m][cb.dataset.perm] = cb.checked;
      });
      try { await api('/roles/' + current + '/permissions', { method: 'PUT', body: { permissions } }); toast('Permissions saved'); }
      catch (e) { toast(e.message, 'error'); }
    };
    el('r_new').onclick = async () => {
      const name = prompt('New role name:'); if (!name) return;
      try { await api('/roles', { method: 'POST', body: { name } }); toast('Role created'); viewRoles(); }
      catch (e) { toast(e.message, 'error'); }
    };
  }

          <td class="px-4 py-3 text-slate-500">${esc(a.email || '—')}</td>
          <td class="px-4 py-3"><span class="rounded-md bg-slate-100 px-2 py-0.5 text-xs uppercase">${esc(a.role)}</span></td>
          <td class="px-4 py-3 text-xs text-slate-500">${dtFmt(a.lastLogin)}</td>
          <td class="px-4 py-3 text-right"><button data-id="${a.id}" class="a_toggle rounded-lg border border-slate-200 px-3 py-1 text-xs hover:bg-slate-100">Toggle</button></td>
        </tr>`).join('')}</tbody></table>
      </div>`;
    el('a_new').onclick = openAdminForm;
    el('view').querySelectorAll('.a_toggle').forEach((b) => b.onclick = async () => {
      try { await api(`/admins/${b.dataset.id}/toggle`, { method: 'POST', body: {} }); toast('Updated'); viewAdmins(); }
      catch (e) { toast(e.message, 'error'); }
    });
  }

  function openAdminForm() {
    openModal(`<div class="p-6">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Add Super Admin</h3>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl">Name *</label><input id="a_name" class="inp" /></div>
        <div><label class="lbl">Username *</label><input id="a_user" class="inp" /></div>
        <div><label class="lbl">Email</label><input id="a_email" class="inp" /></div>
        <div><label class="lbl">Role</label><select id="a_role" class="inp"><option value="support_admin">support_admin</option><option value="super_admin">super_admin</option><option value="root_super_admin">root_super_admin</option></select></div>
        <div class="col-span-2"><label class="lbl">Password *</label><input id="a_pass" class="inp" /></div>
      </div>
      <div id="a_err" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2 mt-3"></div>
      <div class="flex justify-end gap-2 mt-5"><button onclick="__closeModal()" class="rounded-lg border border-slate-200 px-4 py-2 text-sm">Cancel</button>
        <button id="a_save" class="rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold">Create</button></div>
    </div>`);
    el('a_save').onclick = async () => {
      try {
        await api('/admins', { method: 'POST', body: { name: el('a_name').value.trim(), username: el('a_user').value.trim(), email: el('a_email').value.trim(), password: el('a_pass').value, role: el('a_role').value } });
        closeModal(); toast('Super admin created'); viewAdmins();
      } catch (e) { el('a_err').textContent = e.message; el('a_err').classList.remove('hidden'); }
    };
  }

  // ── audit logs ──────────────────────────────────────────────────────────
  let auditState = { page: 1, search: '' };
  async function viewAudit() {
    el('view').innerHTML = `
      <div class="flex items-center gap-2 mb-4">
        <input id="au_search" value="${esc(auditState.search)}" placeholder="Search admin, action, module…" class="w-80 rounded-xl border border-slate-200 px-4 py-2 text-sm" />
      </div>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden"><div id="au_table">${spinner()}</div></div>
      <div id="au_pager" class="flex items-center justify-between mt-4 text-sm text-slate-500"></div>`;
    el('au_search').addEventListener('keydown', (e) => { if (e.key === 'Enter') { auditState.search = e.target.value; auditState.page = 1; loadAudit(); } });
    loadAudit();
  }
  async function loadAudit() {
    const q = new URLSearchParams({ page: auditState.page, pageSize: 25, search: auditState.search });
    const res = await api('/audit-logs?' + q);
    el('au_table').innerHTML = `<table class="w-full text-sm"><thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-400"><tr>
      <th class="text-left px-4 py-3">When</th><th class="text-left px-4 py-3">Admin</th><th class="text-left px-4 py-3">Action</th>
      <th class="text-left px-4 py-3">Module</th><th class="text-left px-4 py-3">Target</th><th class="text-left px-4 py-3">IP</th>
    </tr></thead><tbody>${res.data.map((r) => `<tr class="border-b border-slate-50">
      <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${dtFmt(r.created_at)}</td>
      <td class="px-4 py-3">${esc(r.admin_name || '—')}</td>
      <td class="px-4 py-3"><span class="rounded-md bg-slate-100 px-2 py-0.5 text-xs">${esc(r.action)}</span></td>
      <td class="px-4 py-3 text-slate-500">${esc(r.module || '')}</td>
      <td class="px-4 py-3 text-slate-500">${r.target_type ? esc(r.target_type) + ' #' + esc(r.target_id || '') : (r.clinic_id ? 'clinic #' + r.clinic_id : '—')}</td>
      <td class="px-4 py-3 text-xs text-slate-400">${esc(r.ip || '')}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="px-4 py-10 text-center text-slate-400">No logs.</td></tr>'}</tbody></table>`;
    const tp = res.totalPages || 1;
    el('au_pager').innerHTML = `<div>Page ${auditState.page} of ${tp} · ${num(res.total)} entries</div>
      <div class="flex gap-2"><button id="ap_prev" class="rounded-lg border border-slate-200 px-3 py-1 ${auditState.page <= 1 ? 'opacity-40 pointer-events-none' : ''}">Prev</button>
      <button id="ap_next" class="rounded-lg border border-slate-200 px-3 py-1 ${auditState.page >= tp ? 'opacity-40 pointer-events-none' : ''}">Next</button></div>`;
    el('ap_prev').onclick = () => { auditState.page--; loadAudit(); };
    el('ap_next').onclick = () => { auditState.page++; loadAudit(); };
  }

  // ── account ─────────────────────────────────────────────────────────────
  async function viewAccount() {
    el('view').innerHTML = `
      <div class="max-w-lg">
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
          <h3 class="font-semibold text-slate-700 mb-1">${esc(admin.name)}</h3>
          <p class="text-sm text-slate-400 mb-4">${esc(admin.username)} · ${esc(admin.role)}</p>
          <h4 class="font-semibold text-slate-700 mt-4 mb-2">Change password</h4>
          <div class="space-y-3">
            <input id="p_cur" type="password" class="inp" placeholder="Current password" />
            <input id="p_new" type="password" class="inp" placeholder="New password (min 8 chars)" />
            <div id="p_err" class="hidden text-sm text-red-600"></div>
            <button id="p_save" class="rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold">Update password</button>
          </div>
        </div>
      </div>`;
    el('p_save').onclick = async () => {
      try {
        await api('/change-password', { method: 'POST', body: { currentPassword: el('p_cur').value, newPassword: el('p_new').value } });
        el('p_cur').value = ''; el('p_new').value = ''; toast('Password updated');
      } catch (e) { el('p_err').textContent = e.message; el('p_err').classList.remove('hidden'); }
    };
  }

  function placeholder(id) {
    const title = (TITLES[id] || [id.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase())])[0];
    const planned = {
      branches: ['Per-branch management for multi-location clinics', 'Branch name, manager, address, contact', 'Employees, patients, appointments, revenue per branch'],
      subscriptions: ['Clinic → plan assignment', 'Renewals, upgrades, downgrades, pause/cancel', 'Trial extension and payment history'],
      billing: ['SaaS subscription invoices', 'Outstanding and failed payments, refunds', 'Tax/VAT and discounts'],
      transactions: ['Payment gateway transactions', 'MRR / ARR and revenue by plan or clinic'],
      coupons: ['Promo codes with fixed/percentage discount', 'Usage limits and eligible plans'],
      features: ['Global feature on/off', 'Plan-based availability', 'Per-clinic overrides and beta access'],
      integrations: ['API keys and webhooks', 'Payment, email, SMS, WhatsApp providers', 'Status, test connection and sync logs'],
      notifications: ['Email / SMS / WhatsApp / in-app / push', 'Global notification configuration'],
      templates: ['Email, SMS and WhatsApp templates', 'Variables, preview, test send, enable/disable'],
      announcements: ['Broadcast to all clinics, a plan or specific users', 'Scheduled announcements and maintenance notices'],
      reports: ['Revenue, subscription, growth and churn reports', 'Export CSV / Excel / PDF'],
      'usage-analytics': ['Feature usage and plan usage', 'Clinic and user growth'],
      'revenue-analytics': ['MRR / ARR, revenue by plan and clinic', 'Failed payment report'],
      'clinic-analytics': ['Clinic-wise clients, patients and appointments', 'Inactive clinics and churn'],
      support: ['Clinic-raised support tickets', 'Priority, assignment, internal notes, response history'],
      feedback: ['Platform feedback from clinics', 'Triage and follow-up'],
      'login-logs': ['Successful and failed logins', 'IP, device and suspicious activity'],
      sessions: ['Active device/session management', 'Force logout and revoke sessions'],
      'security-settings': ['2FA, password rules, session timeout', 'Failed login lockout, IP restrictions, rate limits'],
      settings: ['Platform name, logo, currency, timezone', 'Tax, invoice prefix, support email, maintenance mode'],
      branding: ['White-label logo, colors, custom domain', 'Login, email and invoice branding'],
      storage: ['Storage used per clinic and file type', 'Limits, cleanup and large files'],
      backups: ['Backup now, history and restore points', 'Automatic backup configuration, DB health'],
      'system-health': ['API, database, email and queue status', 'Storage, CPU/RAM and failed jobs'],
      'error-logs': ['Application, API and payment errors', 'Email, SMS and integration failures'],
      maintenance: ['Maintenance mode and scheduled windows', 'Platform-wide notices'],
      users: ['All user types across clinics', 'Search, activate/deactivate, reset password, force logout, login history'],
    }[id] || [];
    el('view').innerHTML = `<div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-10 text-center">
      <div class="text-4xl mb-3">🚧</div>
      <h3 class="text-xl font-bold text-slate-800">${esc(title)}</h3>
      <p class="text-slate-400 mt-1">Planned for an upcoming milestone.</p>
      ${planned.length ? `<ul class="mt-5 inline-block text-left text-sm text-slate-500 space-y-1.5">${planned.map((p) => `<li class="flex gap-2"><span class="text-indigo-500">•</span><span>${esc(p)}</span></li>`).join('')}</ul>` : ''}
      <div class="mt-6"><a href="#/dashboard" class="rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold">Back to dashboard</a></div>
    </div>`;
  }

  function spinner() {
    return '<div class="flex items-center justify-center py-16 text-slate-400"><svg class="animate-spin h-6 w-6 mr-2 text-indigo-500" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>Loading…</div>';
  }

  // ── router ──────────────────────────────────────────────────────────────
  async function render() {
    const route = currentRoute();
    renderNav();
    const t = TITLES[route] || [route.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()), ''];
    el('pageTitle').textContent = t[0];
    el('pageSub').textContent = t[1] || '';
    try {
      if (route === 'dashboard') return await viewDashboard();
      if (route === 'clinics') return await viewClinics();
      if (route === 'plans') return await viewPlans();
      if (route === 'roles') return await viewRoles();
      if (route === 'admins') return await viewAdmins();
      if (route === 'audit-logs') return await viewAudit();
      if (route === 'account') return await viewAccount();
      if (route === 'logout') { doLogout(true); return; }
      return placeholder(route);
    } catch (e) {
      el('view').innerHTML = `<div class="bg-red-50 border border-red-100 text-red-700 rounded-xl p-4">${esc(e.message)}</div>`;
    }
  }

  // ── auth ────────────────────────────────────────────────────────────────
  function showLogin() {
    // Single login page for the whole platform.
    location.replace('/app?next=' + encodeURIComponent('/super-admin'));
  }
  function showApp() {
    el('login').classList.add('hidden'); el('login').classList.remove('flex');
    el('app').classList.remove('hidden');
    el('avatar').textContent = (admin.name || 'S').charAt(0).toUpperCase();
    el('who').innerHTML = `<div class="font-semibold text-slate-200">${esc(admin.name)}</div><div>${esc(admin.role)}</div>`;
  }
  function doLogout(hitServer) {
    if (hitServer && token) { api('/logout', { method: 'POST', body: {} }).catch(() => {}); }
    token = ''; admin = null; localStorage.removeItem(TOKEN_KEY);
    location.replace('/app');
  }
  window.__logout = doLogout;

  el('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = el('loginErr'); err.classList.add('hidden');
    el('loginBtn').disabled = true; el('loginBtn').textContent = 'Signing in…';
    try {
      const res = await fetch('/api/super-admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier: el('li_user').value.trim(), password: el('li_pass').value }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((body.error && body.error.message) || 'Login failed');
      token = body.token; admin = body.admin;
      localStorage.setItem(TOKEN_KEY, token);
      showApp();
      if (!location.hash) location.hash = '#/dashboard';
      render();
    } catch (err2) {
      err.textContent = err2.message; err.classList.remove('hidden');
    } finally {
      el('loginBtn').disabled = false; el('loginBtn').textContent = 'Sign in';
    }
  });

  el('refreshBtn').addEventListener('click', render);
  window.addEventListener('hashchange', render);

  (async function boot() {
    if (!token) return showLogin();
    try {
      const me = await api('/me');
      admin = me.admin; showApp(); render();
    } catch (_) { doLogout(false); }
  })();
})();
</script>
</body>
</html>
